spring.application.name=smart-secure-api-template

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_secure_db
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Spring AI (Ollama Local Model) Configuration
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.1

# JWT & AI Security Agent Settings
app.security.jwt.issuer=self
app.security.jwt.access-token-ttl-minutes=15
app.security.jwt.refresh-token-ttl-days=7
app.security.ai-guard.enabled=true
app.security.ai-guard.block-threshold-score=80

# Spring Boot Actuator Telemetry
management.endpoints.web.exposure.include=health,info,metrics,auditevents,httpexchanges
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN,SECURITY_ANALYST
